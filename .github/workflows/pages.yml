name: Deploy portfolio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Import verified portfolio source
        if: hashFiles('portfolio-import.zip') != ''
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import PurePosixPath
          archive = 'portfolio-import.zip'
          expected = '2065dcc60335edfc3554ca2766144a017cc9b0c505f491bddb60522c6af274cc'
          with open(archive, 'rb') as f:
              assert hashlib.sha256(f.read()).hexdigest() == expected, 'Source checksum mismatch'
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  p = PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in {'README.md', '.gitignore', 'THIRD_PARTY_NOTICES.md', 'dist', 'docs', 'scripts'}
              z.extractall('.')
          PY
          node --check dist/app.js
          node --check dist/content.js
          node --check dist/i18n.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore THIRD_PARTY_NOTICES.md dist docs scripts
          git rm portfolio-import.zip
          git commit -m "Import complete portfolio source"
          git push origin HEAD:main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
